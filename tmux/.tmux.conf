# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

set -g base-index 1
set -g pane-base-index 1

set -g status-position top
set -g renumber-windows on
set -g automatic-rename on

set -g pane-border-lines simple

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# TPM bootstrap
if-shell "test ! -d #{HOME}/.tmux/plugins/tpm" \
  "run 'mkdir -p #{HOME}/.tmux/plugins && git clone https://github.com/tmux-plugins/tpm #{HOME}/.tmux/plugins/tpm'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Catppuccin (latte | frappe | macchiato | mocha)
set -g @catppuccin_flavor 'mocha'

# Initialize TPM (keep at the bottom)
run '~/.tmux/plugins/tpm/tpm'
